spring.application.name=Digital Student Card

# ---------------------------------------------------------------- database (PostgreSQL)
# Every value has a local default and can be overridden by an environment variable (docker-compose sets them).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentcard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------- web
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Honour X-Forwarded-* headers when running behind a reverse proxy (HTTPS).
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.cache.period=1d
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------- the institution
app.institution-name=${APP_INSTITUTION_NAME:University of Technology}
app.institution-short-name=${APP_INSTITUTION_SHORT_NAME:UoT}
app.card-office=${APP_CARD_OFFICE:the Student Card Office}
app.campuses=Pretoria Campus,Soshanguve South Campus,Soshanguve North Campus,Ga-Rankuwa Campus,Arcadia Campus,Arts Campus,eMalahleni Campus,Mbombela Campus,Polokwane Campus
app.departments=Faculty of Information and Communication Technology,Faculty of Engineering and the Built Environment,Faculty of Economics and Finance,Faculty of Management Sciences,Faculty of Humanities,Faculty of Science,Faculty of the Arts and Design

# ---------------------------------------------------------------- cards
# Address put inside QR codes and emails, e.g. http://192.168.1.20:8080. Empty: the address the page was opened with.
app.public-base-url=${APP_PUBLIC_BASE_URL:}
app.card-validity-months=${APP_CARD_VALIDITY_MONTHS:12}
# true: self-registered cards wait for an administrator to approve them.
app.registration-approval=${APP_REGISTRATION_APPROVAL:true}
# If set, the "create the first administrator" page asks for this key.
app.setup-key=${APP_SETUP_KEY:}
# Demo accounts and fictional students for presentations. Only used when the database has no staff yet.
app.demo-seed=${APP_DEMO_SEED:false}

# ---------------------------------------------------------------- email (optional)
# Set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD to turn on emailing cards.
# For Gmail: host smtp.gmail.com, port 587 and a 16-character app password.
app.mail-from=${APP_MAIL_FROM:no-reply@student-card.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000

management.health.mail.enabled=false
