<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: top}"></th:block>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main id="main" class="page page--narrow">
  <p class="crumbs"><a th:href="@{/student/profile}">My details</a></p>
  <div class="page-head"><div><h1>Change password</h1></div></div>
  <form th:replace="~{fragments/forms :: change_password(@{/student/password})}"></form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
